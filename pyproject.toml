[tool.poetry]
name = "my-scientific-profile"
version = "0.3.0"
description = ""
authors = ["Tristan Bereau <bereau@thphys.uni-heidelberg.de>"]
readme = "README.md"
packages = [{include = "my_scientific_profile"}]

[tool.poetry.dependencies]
python = "^3.10"
isort = "^5.12.0"
ipyleaflet = "^0.17.2"
nltk = "^3.8.1"
pandas = "^2.0.3"
# Floor, not a pin: the old ==2.0.2 / pydantic-core==2.1.2 / typing-extensions
# ==4.6.3 freeze held torch at 2.1.x downstream and kept known-vulnerable
# versions in every consumer's lockfile.
pydantic = "^2.7"
unidecode = "^1.3.6"
pyhumps = "^3.8.0"
python-decouple = "^3.8"
xmltodict = "^0.13.0"
pymongo = "^4.4.0"
plotly = "^5.15.0"
bokeh = "^3.2.0"
boto3 = "^1.26.165"
nbformat = "^5.9.0"
matplotlib = "^3.7.1"
confuse = "^2.0.1"
requests = "^2.31.0"
jupyter = "^1.1.1"
numpy = "<1.25"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
